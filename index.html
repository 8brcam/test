<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cueverse Premium Player Card Showcase</title>
    <!-- Stable high-fidelity canvas capture engine library -->
    <script src="https://cloudflare.com"></script>
    <style id="themeStylesheet">
        :root {
            --bg-color: #02040a;
            --panel-bg: #0b0f19;
            --text-color: #f8fafc;
            --card-text: #050401;
            /* Default Gold Theme Initialisation Setup Variables */
            --stat-box-border: #946f02;
            --stat-panel-bg: rgba(30, 20, 1, 0.75);
            --neon-start: #ffd952;
            --neon-mid: #594202;
            --neon-end: #ffd952;
        }

        body {
            font-family: "Arial Black", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            background-color: var(--panel-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.03);
            max-width: 900px;
            width: auto;
            transition: all 0.3s ease;
        }
        /* --- THE EVEN SHIELD ARCHITECTURE --- */
        .card-container {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
        }

        .neon-border-wrapper {
            position: relative;
            width: 278px;
            height: 398px;
            background: linear-gradient(135deg, var(--neon-start) 0%, var(--neon-mid) 50%, var(--neon-end) 100%);
            background-size: 200% 200%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: neonPulse 4s linear infinite;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
            clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%);
        }

        .fut-card {
            position: relative;
            width: 272px;
            height: 392px;
            display: flex;
            flex-direction: column;
            padding: 3px;
            box-sizing: border-box;
            z-index: 2;
            transform: translateZ(35px);
            clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%);
        }

        @keyframes neonPulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, transparent 45%), linear-gradient(225deg, rgba(0,0,0,0.35) 0%, transparent 55%), conic-gradient(from 145deg at 75% 25%, #cfa81f 0deg, #ffd952 50deg, #594202 120deg, transparent 190deg), conic-gradient(from 215deg at 35% 65%, #b59210 0deg, #402e01 80deg, #ffeba3 140deg, transparent 220deg), conic-gradient(from 55deg at 85% 50%, #9e7a0d 0deg, #fff085 60deg, #302200 140deg, transparent 200deg), conic-gradient(from 290deg at 20% 30%, #302200 0deg, #ebd05b 70deg, #876707 150deg, transparent 230deg), linear-gradient(to bottom, #ffe875 0%, #fced4e 45%, #695105 55%, #382501 100%);
            background-blend-mode: overlay, normal, multiply, overlay, soft-light, normal, normal;
            background-size: 100% 100%;
            clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%);
            display: flex;
            flex-direction: column;
            padding: 24px 12px 15px 12px;
            box-sizing: border-box;
            z-index: 2;
        }

        .card-inner::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.6) 42%, rgba(255, 248, 194, 0.7) 48%, transparent 56%);
            background-size: 280% 280%;
            background-position: var(--gloss-x, 170%) var(--gloss-y, 170%);
            mix-blend-mode: color-dodge;
            z-index: 3;
            pointer-events: none;
            transition: background-position 0.15s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .card-top {
            display: flex;
            height: 135px;
            width: 100%;
            margin-top: 5px;
            position: relative;
            z-index: 4;
        }
        .badge-ovr {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 25%;
            gap: 2px;
            padding-top: 5px;
            border-right: 1px solid rgba(0, 0, 0, 0.08);
            z-index: 4;
        }
        .ovr-txt {
            font-size: 46px;
            font-weight: 900;
            line-height: 38px;
            letter-spacing: -2px;
            color: #050401;
            text-shadow: 0 1px 1px rgba(255,255,255,0.4);
        }
        .pos-txt { font-size: 13px; font-weight: 900; text-transform: uppercase; color: #050401; }
        .club-icon { width: 20px; height: 20px; opacity: 0.85; margin-top: 2px; }

        .avatar-placeholder {
            width: 75%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 4;
            height: 100%;
        }
        .avatar-placeholder svg, .avatar-placeholder img {
            width: 90%;
            height: auto;
            max-height: 115px;
            object-fit: contain;
            object-position: center center;
        }

        .name-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 92%;                       
            margin: 15px auto 0 auto;
            padding: 4px 0;
            z-index: 4;
            background-color: var(--stat-panel-bg); 
            border: 2px solid var(--stat-box-border); 
            border-radius: 8px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }
        .player-name {
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.2px;
            margin: 0;
            padding: 3px 10px;
            color: #ffffff; 
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.95); 
        }

        .stats-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;       
            width: 92%;               
            margin: 14px auto 0 auto;
            z-index: 4; 
            background-color: var(--stat-panel-bg);
            border-radius: 8px;
            border: 2px solid var(--stat-box-border); 
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.55);
            box-sizing: border-box;
        }
        .stat-column { display: flex; flex-direction: column; gap: 3px; flex: 1; }
        .stat-item { display: flex; align-items: center; justify-content: flex-start; gap: 10px; line-height: 1.1; width: 100%; }
        .stat-val { font-size: 22px; font-weight: 900; color: #fff; width: 32px; text-align: left; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .stat-label { font-size: 15px; font-weight: 800; color: #ffd84a; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .stats-vertical-divider { width: 2px; height: 68px; background-color: var(--stat-box-border); opacity: 0.75; margin: 0 8px; border-radius: 1px; }

        /* --- CONTROL PANEL SIDEBAR --- */
        .controls-panel { 
            display: none; 
            flex-direction: column; 
            gap: 14px; 
            width: 320px; 
            border-left: 1px solid #374151; 
            padding-left: 30px; 
            max-height: 90vh; 
            overflow-y: auto; 
        }
        h2 { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin-top: 0; font-size: 24px; border-bottom: 1px solid #475569; padding-bottom: 8px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; color: #94a3b8; }
        input[type="text"], select, textarea { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0f172a; border: 1px solid #475569; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 15px; outline: none; }
        .btn-upload { font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; transition: background-color 0.2s; }
        .slider-row { display: flex; align-items: center; gap: 12px; }
        input[type="range"] { flex: 1; accent-color: #dca021; cursor: pointer; }
        .slider-val { width: 30px; text-align: right; font-weight: 700; font-size: 15px; }

        @media (max-width: 768px) {
            .container { flex-direction: column; align-items: center; }
            .controls-panel { width: 100%; border-left: none; border-top: 1px solid #374151; padding-left: 0; padding-top: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card-container">
        <!-- Outer Glowing Geometric Frame Wrapper -->
        <div class="neon-border-wrapper" id="glowWrapper">
            <div class="fut-card" id="cardElement">
                <!-- Multi-layered Foil Composite Face -->
                <div class="card-inner" id="cardInnerLayer">
                    
                    <div class="card-top">
                        <div class="badge-ovr">
                            <span class="ovr-txt" id="cardOvr">85</span>
                            <span class="pos-txt" id="cardPos">CUE</span>
                            <span id="cardFlag" style="font-size: 22px; line-height: 1; margin: 4px 0; display: inline-block; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));">🇵🇹</span>
                            <svg class="club-icon" viewBox="0 0 100 100" xmlns="http://w3.org">
                                <circle cx="50" cy="50" r="45" fill="#000"/><circle cx="50" cy="50" r="20" fill="#fff"/>
                            </svg>
                        </div>
                        <div class="avatar-placeholder" id="avatarPlaceholder">
                            <svg id="defaultSilhouette" viewBox="0 0 100 100" xmlns="http://w3.org">
                                <path d="M50,90 C30,90 20,75 20,60 C20,40 30,20 50,20 C70,20 80,40 80,60 C80,75 70,90 50,90 Z" fill="#000" opacity="0.25"/>
                                <circle cx="50" cy="40" r="18" fill="#000" opacity="0.25"/>
                            </svg>
                        </div>
                    </div>
                    
                    <div class="name-box">
                        <div class="player-name" id="cardName">Player Name</div>
                    </div>
                    
                    <div class="stats-grid" id="statsGridElement">
                        <div class="stat-column">
                            <div class="stat-item"><span class="stat-val" id="cardAgg">85</span><span class="stat-label">AGG</span></div>
                            <div class="stat-item"><span class="stat-val" id="cardCtr">85</span><span class="stat-label">CTR</span></div>
                            <div class="stat-item"><span class="stat-val" id="cardSel">85</span><span class="stat-label">SEL</span></div>
                        </div>
                        <div class="stats-vertical-divider"></div>
                        <div class="stat-column">
                            <div class="stat-item"><span class="stat-val" id="cardPot">85</span><span class="stat-label">POT</span></div>
                            <div class="stat-item"><span class="stat-val" id="cardSaf">85</span><span class="stat-label">SAF</span></div>
                            <div class="stat-item"><span class="stat-val" id="cardTem">85</span><span class="stat-label">TEM</span></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Administrative Configuration Controls Panel -->
    <div class="controls-panel" id="adminPanel">
        <h2>Cueverse Card Editor</h2>
        
        <div class="input-group">
            <label for="nameInput">Player Name</label>
            <input type="text" id="nameInput" value="Player Name" maxlength="14">
        </div>

        <div class="input-group">
            <label for="urlInput">Player Portrait (Image URL) [Highly Recommended]</label>
            <input type="text" id="urlInput" placeholder="https://example.com">
        </div>

        <div class="input-group">
            <label>Or Upload File (Visual Preview Only)</label>
            <button type="button" class="btn-upload" style="background-color: #2563eb;" onclick="document.getElementById('imageLoader').click();">Choose Local File</button>
            <input type="file" id="imageLoader" accept="image/*" style="display: none !important;">
        </div>

        <div class="input-group">
            <label for="countryInput">Player Nationality</label>
            <select id="countryInput">
                <option value="pt" selected>Portugal</option>
                <option value="gb">United Kingdom</option>
                <option value="us">United States</option>
                <option value="br">Brazil</option>
                <option value="de">Germany</option>
            </select>
        </div>

        <div class="input-group">
            <label for="tierInput">Card Tier Theme Color Preset</label>
            <select id="tierInput">
                <option value="gold" selected>Gold Crystal Chards</option>
                <option value="silver">Silver Crystal Chards</option>
                <option value="bronze">Bronze Crystal Chards</option>
            </select>
        </div>

        <div class="input-group"><label for="aggInput">Aggression (AGG)</label><div class="slider-row"><input type="range" id="aggInput" min="10" max="99" value="85"><span class="slider-val" id="aggVal">85</span></div></div>
        <div class="input-group"><label for="ctrInput">Control (CTR)</label><div class="slider-row"><input type="range" id="ctrInput" min="10" max="99" value="85"><span class="slider-val" id="ctrVal">85</span></div></div>
        <div class="input-group"><label for="selInput">Shot Selection (SEL)</label><div class="slider-row"><input type="range" id="selInput" min="10" max="99" value="85"><span class="slider-val" id="selVal">85</span></div></div>
        <div class="input-group"><label for="potInput">Potting (POT)</label><div class="slider-row"><input type="range" id="potInput" min="10" max="99" value="85"><span class="slider-val" id="potVal">85</span></div></div>
        <div class="input-group"><label for="safInput">Safety (SAF)</label><div class="slider-row"><input type="range" id="safInput" min="10" max="99" value="85"><span class="slider-val" id="safVal">85</span></div></div>
        <div class="input-group"><label for="temInput">Temperament (TEM)</label><div class="slider-row"><input type="range" id="temInput" min="10" max="99" value="85"><span class="slider-val" id="temVal">85</span></div></div>

        <div class="input-group" style="margin-top: 10px; border-top: 1px solid #374151; padding-top: 15px;">
            <button type="button" class="btn-upload" style="background-color: #3b82f6; margin-bottom: 10px;" onclick="downloadCardAsPNG()">Download Card Image (PNG)</button>
            <button type="button" class="btn-upload" style="background-color: #10b981; margin-bottom: 10px;" onclick="generateFullPageCode()" id="actionBtn">1. Copy First Card (Creates Page)</button>
            <button type="button" class="btn-upload" style="background-color: #8b5cf6;" onclick="generateSingleCardCode()" id="actionBtn2">2. Copy Next Cards (Adds to Page)</button>
        </div>
        
        <div class="input-group" id="outputArea" style="display: none; margin-top: 10px;">
            <textarea id="codeBox" rows="3" style="font-family: monospace; font-size: 11px;" readonly></textarea>
        </div>
    </div>
</div>
<script>
    // 1. DOM Target Configurations
    const cardName = document.getElementById('cardName');
    const cardFlag = document.getElementById('cardFlag');
    const cardInnerLayer = document.getElementById('cardInnerLayer');
    const avatarContainer = document.getElementById('avatarPlaceholder');
    const glowWrapper = document.getElementById('glowWrapper');
    const nameInput = document.getElementById('nameInput');
    const urlInput = document.getElementById('urlInput');
    const countryInput = document.getElementById('countryInput');
    const tierInput = document.getElementById('tierInput');
    const imageLoader = document.getElementById('imageLoader');
    const metrics = ['agg', 'ctr', 'sel', 'pot', 'saf', 'tem'];

    const flags = { pt: "🇵🇹", gb: "🇬🇧", us: "🇺🇸", br: "🇧🇷", de: "🇩🇪" };

    function injectAvatarImage(srcUrl) {
        avatarContainer.innerHTML = '';
        const img = document.createElement('img');
        img.src = srcUrl;
        img.style.cssText = "width: 90%; height: auto; max-height: 115px; object-fit: contain; object-position: center center; z-index: 4; position: relative;";
        avatarContainer.appendChild(img);
    }

    // 2. Interactive Tilt Controller
    if (glowWrapper) {
        glowWrapper.addEventListener('mousemove', (e) => {
            const rect = glowWrapper.getBoundingClientRect();
            const x = e.clientX - rect.left; 
            const y = e.clientY - rect.top; 
            const rotateX = ((y / rect.height) - 0.5) * -28; 
            const rotateY = ((x / rect.width) - 0.5) * 28;
            glowWrapper.style.transform = `scale(1.14) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            const glossX = (x / rect.width) * 100;
            const glossY = (y / rect.height) * 100;
            cardInnerLayer.style.setProperty('--gloss-x', `${100 - glossX}%`);
            cardInnerLayer.style.setProperty('--gloss-y', `${100 - glossY}%`);
        });

        glowWrapper.addEventListener('mouseleave', () => {
            glowWrapper.style.transform = 'scale(1) rotateX(0deg) rotateY(0deg)';
            cardInnerLayer.style.setProperty('--gloss-x', '170%');
            cardInnerLayer.style.setProperty('--gloss-y', '170%');
        });
    }

    // 3. Picture Pipeline Loaders
    if (urlInput) {
        urlInput.addEventListener('input', (e) => {
            const trimmedUrl = e.target.value.trim();
            if (trimmedUrl) injectAvatarImage(trimmedUrl);
        });
    }

    if (imageLoader) {
        imageLoader.addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) { 
                const reader = new FileReader();
                reader.onload = function(event) {
                    injectAvatarImage(event.target.result);
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });
    }
    // 4. Theme Engine Setup Configurations
    const tierThemes = {
        gold: {
            boxBorder: "#946f02",
            panelBg: "rgba(30, 20, 1, 0.75)",
            neonStart: "#ffd952", neonMid: "#594202", neonEnd: "#ffd952",
            bgGradient: "conic-gradient(from 145deg at 75% 25%, #cfa81f 0deg, #ffd952 50deg, #594202 120deg, transparent 190deg), conic-gradient(from 215deg at 35% 65%, #b59210 0deg, #402e01 80deg, #ffeba3 140deg, transparent 220deg), conic-gradient(from 55deg at 85% 50%, #9e7a0d 0deg, #fff085 60deg, #302200 140deg, transparent 200deg), conic-gradient(from 290deg at 20% 30%, #302200 0deg, #ebd05b 70deg, #876707 150deg, transparent 230deg), linear-gradient(to bottom, #ffe875 0%, #fced4e 45%, #695105 55%, #382501 100%)"
        },
        silver: {
            boxBorder: "#475569",
            panelBg: "rgba(15, 23, 42, 0.65)",
            neonStart: "#cbd5e1", neonMid: "#475569", neonEnd: "#cbd5e1",
            bgGradient: "conic-gradient(from 145deg at 75% 25%, #94a3b8 0deg, #ffffff 50deg, #475569 120deg, transparent 190deg), conic-gradient(from 215deg at 35% 65%, #cbd5e1 0deg, #1e293b 80deg, #f8fafc 140deg, transparent 220deg), linear-gradient(to bottom, #f1f5f9 0%, #cbd5e1 45%, #334155 55%, #0f172a 100%)"
        },
        bronze: {
            boxBorder: "#451a03",
            panelBg: "rgba(43, 17, 2, 0.7)",
            neonStart: "#d97706", neonMid: "#451a03", neonEnd: "#d97706",
            bgGradient: "conic-gradient(from 145deg at 75% 25%, #b45309 0deg, #ffedd5 50deg, #451a03 120deg, transparent 190deg), conic-gradient(from 215deg at 35% 65%, #d97706 0deg, #2b1102 80deg, #fed7aa 140deg, transparent 220deg), linear-gradient(to bottom, #ffedd5 0%, #fed7aa 45%, #451a03 55%, #1c0a00 100%)"
        }
    };

    function applyTierTheming(selectedTier) {
        if (!cardInnerLayer) return;
        const theme = tierThemes[selectedTier] || tierThemes.gold;
        
        document.documentElement.style.setProperty('--stat-box-border', theme.boxBorder); 
        document.documentElement.style.setProperty('--stat-panel-bg', theme.panelBg);
        document.documentElement.style.setProperty('--neon-start', theme.neonStart);
        document.documentElement.style.setProperty('--neon-mid', theme.neonMid);
        document.documentElement.style.setProperty('--neon-end', theme.neonEnd);
        
        cardInnerLayer.style.backgroundImage = `linear-gradient(135deg, rgba(255,255,255,0.7) 0%, transparent 45%), linear-gradient(225deg, rgba(0,0,0,0.3) 0%, transparent 55%), ${theme.bgGradient}`;
    }

    // 5. Dynamic Sync Form Values & Compute Rounded Card OVR
    function updateCard() {
        cardName.textContent = nameInput.value || "Player Name";
        cardFlag.textContent = flags[countryInput.value];
        let totalStatsValue = 0;
        metrics.forEach(m => {
            const inputEl = document.getElementById(`${m}Input`);
            const valEl = document.getElementById(`${m}Val`);
            const displayEl = document.getElementById(`card${m.charAt(0).toUpperCase() + m.slice(1)}`);
            if (inputEl) {
                const val = parseInt(inputEl.value, 10) || 0;
                totalStatsValue += val;
                if (valEl) valEl.textContent = val;
                if (displayEl) displayEl.textContent = val;
            }
        });
        const ovrEl = document.getElementById('cardOvr');
        if (ovrEl) ovrEl.textContent = Math.round(totalStatsValue / metrics.length);
        if (tierInput) applyTierTheming(tierInput.value);
    }

    function downloadCardAsPNG() {
        const cardTargetNode = document.getElementById('cardElement');
        if (!cardTargetNode) return;
        if (glowWrapper) glowWrapper.style.transform = 'scale(1) rotateX(0deg) rotateY(0deg)';
        html2canvas(cardTargetNode, { useCORS: true, scale: 2, backgroundColor: null }).then(canvas => {
            const a = document.createElement('a');
            a.download = `cueverse_card.png`;
            a.href = canvas.toDataURL('image/png');
            a.click();
        });
    }
    // --- THE UNIQUE SIGNATURE COMPILER PIPELINE ---
    function captureCleanHtmlStructure() {
        const uniqueSeed = Math.random().toString(36).substring(2, 7);
        const sourceClone = document.querySelector('.card-container').cloneNode(true);
        
        sourceClone.querySelectorAll('[id]').forEach(el => {
            el.removeAttribute('id');
        });

        // BUNDLE SIZE SAFETY LOCK: Replaces raw file strings with a clean vector placeholder if Image URL is empty
        const imgNode = sourceClone.querySelector('.avatar-placeholder img');
        if (imgNode && (!urlInput.value.trim())) {
            const svgPlaceholder = `<svg viewBox="0 0 100 100" style="width:90%; height:auto; max-height:115px;"><path d="M50,90 C30,90 20,75 20,60 C20,40 30,20 50,20 C70,20 80,40 80,60 C80,75 70,90 50,90 Z" fill="#000" opacity="0.25"/><circle cx="50" cy="40" r="18" fill="#000" opacity="0.25"/></svg>`;
            const placeholderBox = sourceClone.querySelector('.avatar-placeholder');
            if (placeholderBox) placeholderBox.innerHTML = svgPlaceholder;
        }

        const wrapperNode = sourceClone.querySelector('.neon-border-wrapper');
        const innerNode = sourceClone.querySelector('.card-inner');

        if (wrapperNode) wrapperNode.className = `neon-border-wrapper wrapper-${uniqueSeed}`;
        if (innerNode) innerNode.className = `card-inner inner-${uniqueSeed}`;

        return { html: sourceClone.innerHTML, seed: uniqueSeed };
    }

    // 7A. Master Page Generator (FIXED FOR FLUID UN-TRUNCATED OUTPUT)
    window.generateFullPageCode = function() {
        const currentTier = tierInput ? tierInput.value : 'gold';
        const theme = tierThemes[currentTier];
        const cardAsset = captureCleanHtmlStructure();

        // Outputs structural CSS code layout without inline string splitting traps
        const stylesBlock = `<style>
            :root {
                --bg-color: #02040a; --panel-bg: #0b0f19; --text-color: #f8fafc; --card-text: #050401;
                --stat-box-border: ${theme.boxBorder}; --stat-panel-bg: ${theme.panelBg};
                --neon-start: ${theme.neonStart}; --neon-mid: ${theme.neonMid}; --neon-end: ${theme.neonEnd};
            }
            body { font-family: "Arial Black", sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
            .card-container { display: inline-flex; justify-content: center; align-items: center; perspective: 1500px; }
            .neon-border-wrapper { position: relative; width: 278px; height: 398px; background: linear-gradient(135deg, var(--neon-start) 0%, var(--neon-mid) 50%, var(--neon-end) 100%); background-size: 200% 200%; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; animation: neonPulse 4s linear infinite; transform-style: preserve-3d; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease; clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%); }
            .fut-card { position: relative; width: 272px; height: 392px; display: flex; flex-direction: column; padding: 3px; box-sizing: border-box; z-index: 2; transform: translateZ(35px); clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%); }
            @keyframes neonPulse { \n0% { background-position: 0% 50%; } \n50% { background-position: 100% 50%; } \n100% { background-position: 0% 50%; }\n }
            .card-inner { position: relative; width: 100%; height: 100%; background-blend-mode: overlay, normal, multiply, overlay, soft-light, normal, normal; background-size: 100% 100%; clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%); display: flex; flex-direction: column; padding: 24px 12px 15px 12px; box-sizing: border-box; z-index: 2; background-image: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, transparent 45%), linear-gradient(225deg, rgba(0,0,0,0.3) 0%, transparent 55%), ${theme.bgGradient};}
            .card-inner::after { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.6) 42%, rgba(255, 248, 194, 0.7) 48%, transparent 56%); background-size: 280% 280%; background-position: var(--gloss-x, 170%) var(--gloss-y, 170%); mix-blend-mode: color-dodge; z-index: 3; pointer-events: none; transition: background-position 0.15s cubic-bezier(0.25, 1, 0.5, 1); }
            .card-top { display: flex; height: 135px; width: 100%; margin-top: 5px; position: relative; z-index: 4; }
            .badge-ovr { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 25%; gap: 2px; padding-top: 5px; border-right: 1px solid rgba(0, 0, 0, 0.08); z-index: 4; }
            .ovr-txt { font-size: 46px; font-weight: 900; line-height: 38px; letter-spacing: -2px; color: #050401; text-shadow: 0 1px 1px rgba(255,255,255,0.4); }
            .pos-txt { font-size: 13px; font-weight: 900; text-transform: uppercase; color: #050401; }
            .club-icon { width: 20px; height: 20px; opacity: 0.85; margin-top: 2px; }
            .avatar-placeholder { width: 75%; display: flex; justify-content: center; align-items: center; overflow: hidden; z-index: 4; height: 100%; }
            .avatar-placeholder svg, .avatar-placeholder img { width: 90%; height: auto; max-height: 115px; object-fit: contain; object-position: center center; }
            .name-box { display: flex; justify-content: center; align-items: center; width: 92%; margin: 15px auto 0 auto; padding: 4px 0; z-index: 4; background-color: var(--stat-panel-bg); border: 2px solid var(--stat-box-border); border-radius: 8px; box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4); box-sizing: border-box; }
            .player-name { text-align: center; font-family: sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.2px; margin: 0; padding: 3px 10px; color: #ffffff; text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.95); }
            .stats-grid { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; width: 92%; margin: 14px auto 0 auto; z-index: 4; background-color: var(--stat-panel-bg); border-radius: 8px; border: 2px solid var(--stat-box-border); box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.55); box-sizing: border-box; }
            .stat-column { display: flex; flex-direction: column; gap: 3px; flex: 1; }
            .stat-item { display: flex; align-items: center; justify-content: flex-start; gap: 10px; line-height: 1.1; width: 100%; }
            .stat-val { font-size: 22px; font-weight: 900; color: #fff; width: 32px; text-align: left; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
            .stat-label { font-size: 15px; font-weight: 800; color: #ffd84a; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
            .stats-vertical-divider { width: 2px; height: 68px; background-color: var(--stat-box-border); opacity: 0.75; margin: 0 8px; border-radius: 1px; }
        </style>`;
        const automationScript = `
        <script>
            (function() {
                const mapTrackingLoop = (seed) => {
                    const wrapper = document.querySelector('.wrapper-' + seed);
                    const inner = document.querySelector('.inner-' + seed);
                    if (wrapper && inner && !wrapper.dataset.listening) {
                        wrapper.dataset.listening = "true";
                        wrapper.addEventListener('mousemove', (e) => {
                            const r = wrapper.getBoundingClientRect();
                            const rx = ((e.clientY - r.top) / r.height - 0.5) * -28;
                            const ry = ((e.clientX - r.left) / r.width - 0.5) * 28;
                            wrapper.style.transform = 'scale(1.14) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
                            inner.style.setProperty('--gloss-x', (100 - (e.clientX - r.left) / r.width * 100) + '%');
                            inner.style.setProperty('--gloss-y', (100 - (e.clientY - r.top) / r.height * 100) + '%');
                        });
                        wrapper.addEventListener('mouseleave', () => {
                            wrapper.style.transform = 'scale(1) rotateX(0deg) rotateY(0deg)';
                            inner.style.setProperty('--gloss-x', '170%');
                            inner.style.setProperty('--gloss-y', '170%');
                        });
                    }
                };
                window.addEventListener('DOMContentLoaded', () => mapTrackingLoop('${cardAsset.seed}'));
                window.cueverseBinder = mapTrackingLoop;
            })();
        <\/script>`;

        const fixedCardStructure = `<div class="card-container" style="perspective: 1500px; display: inline-flex; justify-content: center; align-items: center; margin: 20px;">${cardAsset.html}</div>`;
        const finalPayload = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">${stylesBlock}</head><body style="background:#02040a; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; min-height:100vh; gap:20px; margin:0; padding:20px; box-sizing:border-box;">${fixedCardStructure}${automationScript}</body></html>`;
        
        copyToClipboard(finalPayload, 'actionBtn', 'Master Page Copied! ✓');
    };

    // 7B. Appender Generator (Copies only the card layer)
    window.generateSingleCardCode = function() {
        const cardAsset = captureCleanHtmlStructure();
        const currentTier = tierInput ? tierInput.value : 'gold';
        const theme = tierThemes[currentTier];

        const inlineStylesOverride = `style="--stat-box-border: ${theme.boxBorder}; --stat-panel-bg: ${theme.panelBg}; --neon-start: ${theme.neonStart}; --neon-mid: ${theme.neonMid}; --neon-end: ${theme.neonEnd};"`;
        
        const cardPayload = `
        <div class="card-container" ${inlineStylesOverride} style="perspective: 1500px; display: inline-flex; justify-content: center; align-items: center; margin: 20px;">
            ${cardAsset.html}
        </div>
        <script>if(window.cueverseBinder) window.cueverseBinder('${cardAsset.seed}');<\/script>`;
        
        copyToClipboard(cardPayload.trim(), 'actionBtn2', 'Clean Card Code Copied! ✓');
    };

    function copyToClipboard(text, buttonId, successText) {
        const codeBox = document.getElementById('codeBox');
        const outputArea = document.getElementById('outputArea');
        const btn = document.getElementById(buttonId);
        if (codeBox) codeBox.value = text;
        if (outputArea) outputArea.style.display = 'block';

        navigator.clipboard.writeText(text).then(() => {
            if (btn) {
                const originalText = btn.textContent;
                btn.textContent = successText;
                btn.style.backgroundColor = "#059669";
                setTimeout(() => { btn.textContent = originalText; btn.style.backgroundColor = buttonId === 'actionBtn' ? "#10b981" : "#8b5cf6"; }, 2000);
            }
        });
    }

    // Secret URL Search String Parameter Guard Verification
    const urlParameters = new URLSearchParams(window.location.search);
    if (urlParameters.get('edit') === 'true') {
        const adminPanel = document.getElementById('adminPanel');
        if (adminPanel) adminPanel.style.display = 'flex';
    }

    [nameInput, countryInput, tierInput].forEach(el => {
        if (el) el.addEventListener('input', updateCard);
    });
    metrics.forEach(m => {
        const el = document.getElementById(`${m}Input`);
        if (el) el.addEventListener('input', updateCard);
    });
    updateCard();
</script>
</body>
